# Agentic AI Tutor - Docker Compose Configuration
# Supports both development and production environments

version: '3.8'

services:
  # ============================================================================
  # Main Application
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agentic-tutor-app
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - DEFAULT_GEMINI_API_KEY=${DEFAULT_GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tutor-network

  # ============================================================================
  # Development Environment
  # ============================================================================
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: agentic-tutor-dev
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - DEFAULT_GEMINI_API_KEY=${DEFAULT_GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - DEBUG=true
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - tutor-network
    profiles:
      - dev

  # ============================================================================
  # Prometheus Monitoring (Optional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: agentic-tutor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - tutor-network
    profiles:
      - monitoring

  # ============================================================================
  # Grafana Dashboard (Optional)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: agentic-tutor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - tutor-network
    profiles:
      - monitoring

# ============================================================================
# Networks
# ============================================================================
networks:
  tutor-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  prometheus-data:
  grafana-data:
