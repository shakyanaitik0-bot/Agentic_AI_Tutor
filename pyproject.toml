[project]
name = "agentic-tutor"
version = "0.2.0"
description = "Agentic AI Tutor for Adaptive Learning in EdTech - Production-Ready Multi-Agent System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    # Validation & Config
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    # LLM & AI
    "openai>=1.10.0",
    "google-generativeai>=0.3.2",
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    # Vector Database
    "pinecone>=3.0.0",
    # Hybrid RAG - BM25 & Knowledge Graph
    "rank-bm25>=0.2.2",
    "networkx>=3.2.1",
    # Cross-encoder for re-ranking (free, local)
    "transformers>=4.36.0",
    # Document Processing
    "pypdf>=4.0.0",
    "python-multipart>=0.0.6",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    # Utilities
    "aiofiles>=23.2.1",
    "tiktoken>=0.5.2",
    "requests>=2.31.0",
    # Security & Auth
    "cryptography>=41.0.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    # Rate Limiting & Monitoring
    "slowapi>=0.1.9",
    "prometheus-client>=0.19.0",
    # Configuration
    "pyyaml>=6.0.1",
    # Email Support
    "pydantic[email]",
    # Caching (Redis-compatible, but works in-memory too)
    "cachetools>=5.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
